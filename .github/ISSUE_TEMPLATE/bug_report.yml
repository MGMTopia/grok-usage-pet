name: Bug report
description: Report a reproducible problem without sharing credentials or private data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Grok Usage Pet. Never attach auth.json, state.vscdb, access tokens, quota snapshots, personal paths, or full logs.
  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - 0.3.9
        - 0.3.8
        - 0.3.7
        - Older release
        - Source build
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - SuperGrok
        - Cursor / Grok Bot
        - Codex
        - Pet UI / animation
        - Startup / watcher
        - Update / GitHub
        - Packaging / installation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible problem. Replace personal values with placeholders.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: sanitized_details
    attributes:
      label: Sanitized details
      description: Optional minimal error text or screenshot with accounts, paths, and tokens removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, account details, private paths, snapshots, and full logs.
          required: true
