name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-build.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Run offline tests
        shell: pwsh
        run: ./run-tests.ps1 -PythonExe python

      - name: Compile entry modules
        run: >-
          python -m compileall -q
          pet.py fetch_usage.py watch_apps.py start_pet.py
          app_version.py usage_model.py snapshot_store.py cursor_hooks.py
          skin_catalog.py pet_view_model.py app_update.py
