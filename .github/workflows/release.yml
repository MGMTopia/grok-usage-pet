name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag and version match
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build, test, and package
        shell: pwsh
        run: ./pack-windows.ps1 -PythonExe python
      - uses: actions/upload-artifact@v7
        with:
          name: GrokUsagePet-Windows-x64
          path: |
            release/GrokUsagePet-*-Windows-x64.zip
            release/GrokUsagePet-*-Windows-x64.zip.sha256
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $pattern = "(?ms)^## $([regex]::Escape($version)) .*?(?=^## |\z)"
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)
          if (-not $section.Success) { throw "CHANGELOG section for $version not found" }
          $notes = $section.Value -replace "(?m)^## $([regex]::Escape($version)) .*?\r?\n", ""
          $notes | Set-Content release-notes.md -Encoding utf8
          $zip = Get-Item "release/GrokUsagePet-v$version-Windows-x64.zip"
          gh release create $env:GITHUB_REF_NAME $zip.FullName "$($zip.FullName).sha256" --verify-tag --title "Grok Usage Pet v$version" --notes-file release-notes.md
