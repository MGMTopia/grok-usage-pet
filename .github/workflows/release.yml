name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build, test, and package
        shell: pwsh
        run: ./pack-windows.ps1 -PythonExe python
      - uses: actions/upload-artifact@v7
        with:
          name: GrokUsagePet-Windows-x64
          path: |
            release/GrokUsagePet-*-Windows-x64.zip
            release/GrokUsagePet-*-Windows-x64.zip.sha256
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem release/GrokUsagePet-*-Windows-x64.zip -File | Select-Object -First 1
          if (-not $zip) { throw "release zip not found" }
          gh release create $env:GITHUB_REF_NAME $zip.FullName "$($zip.FullName).sha256" --verify-tag --generate-notes
