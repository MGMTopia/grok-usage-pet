name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Verify tag and version match
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
      - name: Install hash-locked build dependencies
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Build, test, and package
        shell: pwsh
        run: ./pack-windows.ps1 -PythonExe python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GrokUsagePet-Windows-x64
          path: |
            release/GrokUsagePet-*-Windows-x64.zip
            release/GrokUsagePet-*-Windows-x64.zip.sha256
          if-no-files-found: error

  publish-release:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: GrokUsagePet-Windows-x64
          path: release
      - name: Verify package checksum and release notes
        id: release_files
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = Get-Item "release/GrokUsagePet-v$version-Windows-x64.zip"
          $checksum = Get-Item "$($zip.FullName).sha256"
          $declared = ((Get-Content $checksum.FullName -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          if ($actual -ne $declared) { throw "release checksum mismatch" }
          $pattern = "(?ms)^## $([regex]::Escape($version)) .*?(?=^## |\z)"
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)
          if (-not $section.Success) { throw "CHANGELOG section for $version not found" }
          $notes = $section.Value -replace "(?m)^## $([regex]::Escape($version)) .*?\r?\n", ""
          $notes | Set-Content release-notes.md -Encoding utf8
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$($checksum.FullName)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.release_files.outputs.zip }}
      - name: Publish immutable-ready GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = "${{ steps.release_files.outputs.version }}"
          $zip = "${{ steps.release_files.outputs.zip }}"
          $checksum = "${{ steps.release_files.outputs.checksum }}"
          gh release create $tag $zip $checksum --verify-tag --title "Grok Usage Pet v$version" --notes-file release-notes.md --draft
          gh release edit $tag --draft=false
